- group: 常用功能
  list:
    - title: '#小花火原神帮助 / #小花火星铁帮助'
      desc: '查看对应游戏的详细指令'
    - title: '#小花火绝区零帮助 / #小花火崩三帮助'
      desc: '查看对应游戏的详细指令'
    - title: '#小花火签到 / #小花火全部游戏签到'
      desc: '签到当前账号；全部游戏签到所有已绑定账号'
    - title: '#小花火社区签到 / #小花火社区全部签到'
      desc: '米游社社区签到；全部签到包含米游币任务'
    - title: '#小花火体力 / #小花火全体力'
      desc: '查看原神、星铁、绝区零、崩三体力'
    - title: '体力推送（锅巴面板配置）'
      desc: '在锅巴「体力推送」里选推送群与各游戏阈值，达到阈值自动推送；没有开启/关闭命令'
    - title: '#小花火官方当前卡池'
      desc: '查看四游戏官方卡池'
    - title: '#小花火刷新卡池数据'
      desc: '手动刷新官方卡池缓存'
    - title: '#xx图鉴 / *xx图鉴（如 #芙宁娜图鉴）'
      desc: '查询角色、武器及装备图鉴；只写类别则返回该类全部列表'
    - title: '#怪物图鉴 / #原神怪物图鉴'
      desc: '查询四游戏怪物与首领信息'
    - title: '#xhh原神深渊速报 / #xhh星铁深渊速报'
      desc: '查看原神、星铁、崩三深渊相关信息'
    - title: '#原石 / #星琼 / #绝区零菲林'
      desc: '查询本月原石、星琼、菲林等账本收入，可带月份，如「#原石8月」「#星琼202608」'
    - title: '#原石统计 / #星琼统计 / #绝区零菲林统计'
      desc: '按月统计累计收入（柱状图 + 来源占比环形图）'
    - title: '#小花火原石 / #xhh星琼统计'
      desc: '上面这些账本指令都能加「小花火」或「xhh」前缀，也可以不加'
    - title: '#角色名攻略 / #角色名配队（如 #钟离攻略）'
      desc: '查询角色攻略、深渊和活动配队'
    - title: '#抽卡记录 / #崩三抽卡记录'
      desc: '查看本地抽卡统计'
    - title: '#更新抽卡记录 / #刷新抽卡记录'
      desc: '更新官方抽卡记录'
    - title: '#扫码绑定'
      desc: '扫码绑定米游社账号'
    - title: '#使用兑换码 / #原神使用兑换码'
      desc: '兑换近期收录的兑换码，也可直接跟码；星铁用 *，绝区零用 %'
    - title: '#自动兑换码开启 / #自动兑换码关闭'
      desc: '订阅官方前瞻直播码自动兑换，每 10 分钟检查一次'

- group: 游戏快捷入口
  list:
    - title: '#原神帮助'
      desc: '原神体力、卡池、深渊、图鉴、抽卡和攻略'
    - title: '#星铁帮助'
      desc: '星铁体力、卡池、深渊、图鉴、抽卡和攻略'
    - title: '#绝区零帮助'
      desc: '绝区零体力、防卫战、危局、图鉴、卡池和攻略'
    - title: '#崩三帮助'
      desc: '崩三深渊、战场、乐土、图鉴、卡池和抽卡'
    - title: '#卡池帮助'
      desc: '查看卡池查询、历史卡池和卡池计时指令'
    - title: '#图鉴帮助'
      desc: '查看角色、武器、装备和怪物图鉴指令'
    - title: '#攻略帮助'
      desc: '查看角色攻略、深渊攻略和配队指令'

- group: 账号与设置
  list:
    - title: '#扫码绑定 / #删除stoken'
      desc: '绑定或删除米游社账号'
    - title: '#设备帮助'
      desc: '查看设备绑定和验证相关指令'
    - title: '#小花火B站帮助'
      desc: '查看B站登录、解析、推送和直播功能'
    - title: '#小花火完整帮助'
      desc: '查看全部详细命令，内容较长'
